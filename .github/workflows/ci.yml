name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build against the synthetic fixture snapshot
        run: npm run build
        env:
          DATA_SNAPSHOT: tests/fixtures/snapshot.json
          NEXT_TELEMETRY_DISABLED: "1"
