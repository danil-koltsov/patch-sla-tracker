name: Ingest

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours: 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the 10% shrink guard (only after checking why counts dropped)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-
      - name: Ingest Apple, KEV and NVD into Supabase
        id: ingest
        run: node scripts/ingest/run.ts ${{ inputs.force && '--force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      # The site is a static export: new data goes live only through this rebuild,
      # which runs only when the ingested data changed.
      - name: Trigger Vercel rebuild
        if: steps.ingest.outputs.changed == 'true'
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is not set; data was ingested but the site will not be rebuilt."
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
