name: Ingest

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours: 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the 10% shrink guard (only after checking why counts dropped)"
        type: boolean
        default: false

# Commits data/snapshot.json to main; Vercel's Git integration deploys the push.
permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore HTTP cache and NVD state
        uses: actions/cache@v4
        with:
          path: .cache
          key: ingest-${{ github.run_id }}
          restore-keys: ingest-
      - name: Ingest Apple, KEV and NVD into data/snapshot.json
        run: node scripts/ingest/run.ts ${{ inputs.force && '--force' || '' }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      # "Changed" is defined by git: the snapshot is rewritten only when the data changed.
      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes; nothing to commit or deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: update snapshot ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the data commit to main."
          exit 1
